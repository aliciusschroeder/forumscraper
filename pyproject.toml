[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "forumscraper"
version = "0.1.21"
description = "A forum scraper library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPLv3"}
keywords = ["text-processing", "scraper", "forums", "phpbb", "smf", "xmb", "invision", "xenforo"]
authors = [
  {name = "Dominik Stanisław Suchora", email = "hexderm@gmail.com" }
]

dependencies = ['reliq','zendriver @ git+https://github.com/aliciusschroeder/zendriver.git']

classifiers = [
  "Development Status :: 4 - Beta",

  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

  "Operating System :: OS Independent",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
"Homepage" = "https://github.com/TUVIMEN/forumscraper"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.py","*.reliq"]

[project.scripts]
forumscraper = "forumscraper.__init__:main"
